# =============================================================================
# The Echo Merchant box — one host, five containers
# =============================================================================
#   nginx          the public TLS edge (the only thing bound to a public port)
#   connector      the payment proxy: meters + settles, then proxies to the app
#   echo-merchant  the app: answers each paid packet with a Mirror
#   certbot        renews the certificate
#   watchtower     recreates the app containers when their tag moves
#
#   internet ──▶ nginx :443 ──▶ connector :4000 ──▶ echo-merchant :3000
#
# Bring it up:  ./render.sh && docker compose up -d
# See ./README.md — nothing here works without the key files and .env it lists.
# =============================================================================

name: echo-merchant

services:
  # ── The payment proxy ──────────────────────────────────────────────────────
  # Published on the LOOPBACK only. nginx is what faces the internet; binding
  # this to 0.0.0.0 would put the paid edge on the public internet past ufw
  # (docker's iptables rules bypass ufw).
  connector:
    # Pinned to one immutable release, never a moving tag. tests/deploy_bundle.rs
    # pins the same literal.
    image: ghcr.io/toon-protocol/connector:rust-2026.09.29.1
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    volumes:
      - ./connector.toml:/app/config/connector.toml:ro
      - ./signer.key:/app/data/signer.key:ro
      - ./settlement.key:/app/data/settlement.key:ro
      - ./settlement-solana.key:/app/data/settlement-solana.key:ro
      # The operator surface's two credentials, written by ./render.sh from .env.
      - ./operator-bearer.token:/app/data/operator-bearer.token:ro
      - ./operator-write.keys:/app/data/operator-write.keys:ro
      - connector_state:/app/state
    ports:
      - '127.0.0.1:4000:4000'
    healthcheck:
      # GET /ilp/identity is unauthenticated and answers 200 only once the
      # process is serving AND has read its signer key file.
      # 127.0.0.1, never localhost: the listener is IPv4-only.
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:4000/ilp/identity || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # ── The app ────────────────────────────────────────────────────────────────
  # No `ports:` at all. The connector reaches it over the compose network as
  # the termination of the paid route. A public path to it would be an unpaid
  # door past the price.
  echo-merchant:
    image: ghcr.io/toon-protocol/echo-merchant:release
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    environment:
      ECHO_MERCHANT_ADDR: 0.0.0.0:3000
    expose: ['3000']
    restart: unless-stopped

  # ── The TLS edge ───────────────────────────────────────────────────────────
  # Deliberately NOT Watchtower-labelled: nginx holds the resolver that lets
  # every other container survive being recreated at a new address.
  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    command: >
      sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    restart: unless-stopped

  # Holds the renewal timer; not Watchtower-labelled, same reasoning.
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped

  # ── Unattended updates ─────────────────────────────────────────────────────
  # `--label-enable` means it only touches connector and echo-merchant. Pinned,
  # not floating on :latest. Not labelled itself.
  watchtower:
    image: containrrr/watchtower:1.7.1
    environment:
      DOCKER_API_VERSION: '1.44'
    command: ['--label-enable', '--interval', '60', '--cleanup']
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  # The claim watermark. Back this up; losing it hands every payer their
  # already-spent claims back as free service.
  connector_state:
  certbot_conf:
  certbot_www:
