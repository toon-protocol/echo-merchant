name: Publish image

# Builds the Echo Merchant image and pushes it to GHCR. `release` is the moving
# tag the fleet's Watchtower watches, so only a published, non-prerelease
# release moves it; a manual run publishes only its immutable sha tag.

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency: publish-image-${{ github.ref }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/toon-protocol/echo-merchant

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=release,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
